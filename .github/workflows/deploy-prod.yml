# Producción: cuando un PR test -> main (o un hotfix) se mergea, sube public_html/ a GoDaddy.
#
# Secrets (Settings -> Environments -> produccion):
#   FTP_SERVER          IP del hosting (no el dominio: el dominio pasa por el firewall, que no deja pasar FTP)
#   FTP_USERNAME        cuenta FTP exclusiva para GitHub, encerrada en public_html
#   FTP_PASSWORD
#   SUCURI_API_KEY      (opcional) Website Security -> Firewall -> Settings -> API
#   SUCURI_API_SECRET   (opcional) con estos dos, la caché del firewall se limpia sola
name: Deploy PROD (GoDaddy)

on:
  push:
    branches: [main]
  workflow_dispatch:          # botón "Run workflow" para volver a publicar a mano

permissions:
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: false   # nunca cortar un despliegue a producción a la mitad

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: produccion        # aquí viven los secrets; solo main puede usarlos
      url: https://cauce-ingenieria.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # historial completo: las fechas del sitemap salen de Git

      - name: Fechas reales en sitemap.xml (SEO)
        run: node herramientas/fechas-sitemap.js

      - name: Subir a GoDaddy por FTPS (solo lo que cambió)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # El hosting usa un certificado autofirmado (los visitantes nunca lo ven: entran por el firewall).
          # "loose" mantiene la conexión cifrada pero no exige un certificado de una autoridad reconocida.
          security: loose
          local-dir: ./public_html/
          server-dir: ./        # la cuenta FTP ya arranca dentro de public_html

      - name: Limpiar caché del firewall (Sucuri)
        id: cache
        env:
          KEY: ${{ secrets.SUCURI_API_KEY }}
          SECRET: ${{ secrets.SUCURI_API_SECRET }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "Sin SUCURI_API_KEY / SUCURI_API_SECRET: la caché se limpia a mano."
            echo "estado=manual" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # API v2 de Sucuri: key y secret van en el cuerpo (POST), nunca en la URL ni en el log.
          RESP=$(curl -sS --max-time 60 'https://wafx.sucuri.net/api?v2' \
                   --data-urlencode "k=$KEY" --data-urlencode "s=$SECRET" --data 'a=clear_cache' || true)
          if echo "$RESP" | grep -qE '"status" *: *1'; then
            echo "✔ Caché del firewall limpiada"
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          else
            # Solo se muestran los mensajes de la API, no la respuesta completa.
            echo "::warning::No se pudo limpiar la caché del firewall: $(echo "$RESP" | grep -oE '"messages" *: *\[[^]]*\]' | head -c 300)"
            echo "estado=fallo" >> "$GITHUB_OUTPUT"
          fi

      - name: Resumen
        run: |
          {
            echo "### ✅ Publicado en cauce-ingenieria.com"
            echo ""
            case "${{ steps.cache.outputs.estado }}" in
              ok) echo "Caché del firewall limpiada automáticamente: el cambio ya se ve." ;;
              *)  echo "Limpia la caché del firewall para ver el cambio de inmediato:"
                  echo "godaddy.com → Website Security → Administrar → Firewall → Rendimiento → **Clear Cache**" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
